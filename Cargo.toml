[package]
name = "mmdc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A browser-free, pure-Rust reimplementation of the mermaid-cli `mmdc` command"
license = "CC0-1.0 AND MIT AND CC-BY-4.0 AND OFL-1.1 AND LPPL-1.3c"
readme = "README.md"
keywords = ["mermaid", "diagram", "svg", "cli", "flowchart"]
categories = ["command-line-utilities", "visualization"]

[lib]
name = "mmdc"
path = "src/lib.rs"

[[bin]]
name = "mmdc"
path = "src/main.rs"

[features]
default = ["png", "icons", "fonts"]
# PNG rasterisation via resvg (pure Rust). Disable with --no-default-features
# for a minimal build (only taffy) that supports SVG, PDF and Markdown output.
png = ["dep:resvg"]
# Font Awesome Free 7 icon outlines (CC BY 4.0) for `fa:fa-car` label icons, as
# mmdc draws them (assets/fontawesome, ~0.8 MB). Without it icons become `•`.
icons = []
# TeX Gyre Heros (GUST Font License) bundled as the fallback font for PNG text
# when no system font matches, and embedded in PDFs for text outside
# Windows-1252 (assets/fonts, ~0.5 MB).
fonts = []

[dependencies]
# CSS flexbox / grid / block layout for box-shaped diagrams (block, kanban, C4, ...).
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout"] }
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts"], optional = true }

[[bench]]
name = "render"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
