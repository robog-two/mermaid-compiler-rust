[package]
name = "mmdc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A browser-free, pure-Rust reimplementation of the mermaid-cli `mmdc` command"
license = "CC0-1.0 AND MIT AND CC-BY-4.0 AND OFL-1.1 AND LPPL-1.3c"
readme = "README.md"
keywords = ["mermaid", "diagram", "svg", "cli", "flowchart"]
categories = ["command-line-utilities", "visualization"]

[lib]
name = "mmdc"
path = "src/lib.rs"

[[bin]]
name = "mmdc"
path = "src/main.rs"

[features]
default = ["png", "icons", "fonts", "font-embed"]
# PNG rasterisation via resvg (pure Rust). Disable with --no-default-features
# for a minimal build (only taffy) that supports SVG, PDF and Markdown output.
png = ["dep:resvg", "dep:miniz_oxide"]
# Font Awesome Free 7 icon outlines (CC BY 4.0) for `fa:fa-car` label icons, as
# mmdc draws them (assets/fontawesome, ~0.8 MB). Without it icons become `•`.
icons = []
# The web fonts mmdc loads, Recursive Variable and Open Sans (SIL OFL 1.1), so
# PNG and PDF text in them looks as mmdc draws it, and TeX Gyre Heros (GUST
# Font License) as the fallback font for PNG text when no system font matches
# and for PDF text outside Windows-1252 (assets/fonts, ~1.5 MB). Text is
# measured from compiled-in tables either way.
fonts = []
# SVG output embeds the web fonts a diagram uses as `@font-face` rules with woff2
# `data:` URLs, as mmdc does unless `--no-font-embed` (Recursive Variable, Open
# Sans, Font Awesome Free; SIL OFL 1.1; assets/fontembed, ~0.8 MB, the exact
# files mmdc embeds). Without it SVG text only names its font families.
font-embed = []

[dependencies]
# CSS flexbox / grid / block layout for box-shaped diagrams (block, kanban, C4, ...).
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout"] }
# With `raster-images`, PNG output draws PNG, JPEG, GIF and WebP images.
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "raster-images"], optional = true }
# Flate compression of decoded images in PDF output (already a dependency of
# resvg's PNG codec, so it adds no crate).
miniz_oxide = { version = "0.8", optional = true }

[[bench]]
name = "render"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
