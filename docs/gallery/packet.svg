<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1026 423" style="max-width: 1026px; background-color: white;" role="graphics-document document" aria-roledescription="packet"><style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#552222;}#my-svg .error-text{fill:#552222;stroke:#552222;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#333333;stroke:#333333;}#my-svg .marker.cross{stroke:#333333;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .packetByte{font-size:10px;}#my-svg .packetByte.start{fill:black;}#my-svg .packetByte.end{fill:black;}#my-svg .packetLabel{fill:black;font-size:12px;}#my-svg .packetTitle{fill:black;font-size:14px;}#my-svg .packetBlock{stroke:black;stroke-width:1;fill:#efefef;}#my-svg .node .neo-node{stroke:#9370DB;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#my-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><g class="packetRow"><rect class="packetBlock" x="1" y="15" width="507" height="32" fill="#efefef" stroke="black" stroke-width="1"/><text class="packetLabel" x="254.5" y="34.172" text-anchor="middle" font-size="12" fill="black">Source Port</text><text class="packetByte start" x="1" y="13" text-anchor="start" font-size="10" fill="black">0</text><text class="packetByte end" x="508" y="13" text-anchor="end" font-size="10" fill="black">15</text><rect class="packetBlock" x="513" y="15" width="507" height="32" fill="#efefef" stroke="black" stroke-width="1"/><text class="packetLabel" x="766.5" y="34.172" text-anchor="middle" font-size="12" fill="black">Destination Port</text><text class="packetByte start" x="513" y="13" text-anchor="start" font-size="10" fill="black">16</text><text class="packetByte end" x="1020" y="13" text-anchor="end" font-size="10" fill="black">31</text></g><g class="packetRow"><rect class="packetBlock" x="1" y="62" width="1019" height="32" fill="#efefef" stroke="black" stroke-width="1"/><text class="packetLabel" x="510.5" y="81.172" text-anchor="middle" font-size="12" fill="black">Sequence Number</text><text class="packetByte start" x="1" y="60" text-anchor="start" font-size="10" fill="black">32</text><text class="packetByte end" x="1020" y="60" text-anchor="end" font-size="10" fill="black">63</text></g><g class="packetRow"><rect class="packetBlock" x="1" y="109" width="1019" hei