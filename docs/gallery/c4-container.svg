,404,86C414.493,86,423,91.82,423,99L423,109Z" fill="#FFFFFF" stroke="none"/><text x="404" y="57.7" text-anchor="middle" font-size="12" fill="#FFFFFF">«person»</text><text x="404" y="130.6" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">Customer</text><text x="404" y="158.4" text-anchor="middle" font-size="14" fill="#FFFFFF"><tspan x="404" y="158.4">A customer of the bank,</tspan><tspan x="404" y="175.4">with personal bank</tspan><tspan x="404" y="192.4">accounts</tspan></text></g><g class="c4-shape"><rect x="20" y="345" width="216" height="154" rx="2.5" ry="2.5" fill="#438DD5" stroke="#3C7FC0" stroke-width="0.5"/><text x="128" y="362.7" text-anchor="middle" font-size="12" fill="#FFFFFF">«container»</text><text x="128" y="385.6" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">Single-Page App</text><text x="128" y="405.4" text-anchor="middle" font-size="14" fill="#FFFFFF">[JavaScript, Angular]</text><text x="128" y="432.4" text-anchor="middle" font-size="14" fill="#FFFFFF"><tspan x="128" y="432.4">Provides all the Internet</tspan><tspan x="128" y="449.4">banking functionality to</tspan><tspan x="128" y="466.4">customers via their web</tspan><tspan x="128" y="483.4">browser</tspan></text></g><g class="c4-shape"><rect x="316" y="345" width="216" height="154" rx="2.5" ry="2.5" fill="#B3B3B3" stroke="#A6A6A6" stroke-width="0.5"/><text x="424" y="362.7" text-anchor="middle" font-size="12" fill="#FFFFFF">«external_container»</text><text x="424" y="385.6" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">Mobile App</text><text x="424" y="405.4" text-anchor="middle" font-size="14" fill="#FFFFFF">[C#, Xamarin]</text><text x="424" y="432.4" text-anchor="middle" font-size="14" fill="#FFFFFF"><tspan x="424" y="432.4">Provides a limited subset of</tspan><tspan x="424" y="449.4">the Internet banking</tspan><tspan x="424" y="466.4">functionality to customers</tspan><tspan x="424" y="483.4">via their mobile device</tspan></text></g><g class="c4-shape"><rect x="612" y="345" width="216" height="137" rx="2.5" ry="2.5" fill="#438DD5" stroke="#3C7FC0" stroke-width="0.5"/><text x="720" y="362.7" text-anchor="middle" font-size="12" fill="#FFFFFF">«container»</text><text x="720" y="385.6" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">Web Application</text><text x="720" y="405.4" text-anchor="middle" font-size="14" fill="#FFFFFF">[Java, Spring MVC]</text><text x="720" y="432.4" text-anchor="middle" font-size="14" fill="#FFFFFF"><tspan x="720" y="432.4">Delivers the static content</tspan><tspan x="720" y="449.4">and the Internet banking</tspan><tspan x="720" y="466.4">SPA</tspan></text></g><g class="c4-shape"><path d="M20,577C20,572.582,68.353,569,128,569C187.647,569,236,572.582,236,577L236,739C236,743.418,187.647,747,128,747C68.353,747,20,743.418,20,739Z" fill="#438DD5" stroke="#3C7FC0" stroke-width="0.5"/><path d="M20,577C20,581.418,68.353,585,128,585C187.647,585,236,581.418,236,577" fill="none" stroke="#3C7FC0" stroke-width="0.5"/><text x="128" y="602.7" text-anchor="middle" font-size="12" fill="#FFFFFF">«container_db»</text><text x="128" y="625.6" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">Database</text><text x="128" y="645.4" text-anchor="middle" font-size="14" fill="#FFFFFF">[SQL Database]</text><text x="128" y="672.4" text-anchor="middle" font-size="14" fill="#FFFFFF"><tspan x="128" y="672.4">Stores user registration</tspan><tspan x="128" y="689.4">information, hashed auth</tspan><tspan x="128" y="706.4">credentials, access logs,</tspan><tspan x="128" y="723.4">etc.</tspan></text></g><g class="c4-shape"><path d="M324,569L524,569C528.418,569,532,592.057,532,620.5C532,648.943,528.418,672,524,672L324,672C319.582,672,316,648.943,316,620.5C316,592.057,319.582,569,324,569Z" fill="#438DD5" stroke="#3C7FC0" stroke-width="0.5"/><path d="M524,672C519.582,672,516,648.943,516,620.5C516,592.057,519.582,569,524,569" fill="none" stroke="#3C7FC0" stroke-width="0.5"/><text x="424" y="586.7" text-anchor="middle" font-size="12" fill="#FFFFFF">«container_queue»</text><text x="424" y="609.6" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">Event Bus</text><text x="424" y="629.4" text-anchor="middle" font-size="14" fill="#FFFFFF">[Kafka]</text><text x="424" y="656.4" text-anchor="middle" font-size="14" fill="#FFFFFF">Publishes account events</text></g><g class="c4-shape"><rect x="612" y="569" width="216" height="120" rx="2.5" ry="2.5" fill="#438DD5" stroke="#3C7FC0" stroke-width="0.5"/><text x="720" y="586.7" text-anchor="middle" font-size="12" fill="#FFFFFF">«container»</text><text x="720" y="609.6" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">API Application</text><text x="720" y="629.4" text-anchor="middle" font-size="14" fill="#FFFFFF">[Java, Docker Container]</text><text x="720" y="656.4" text-anchor="middle" font-size="14" fill="#FFFFFF"><tspan x="720" y="656.4">Provides Internet banking</tspan><tspan x="720" y="673.4">functionality via API</tspan></text></g><g class="c4-shape"><rect x="592" y="40" width="216" height="155" rx="2.5" ry="2.5" fill="#999999" stroke="#8A8A8A" stroke-width="0.5"/><text x="700" y="57.7" text-anchor="middle" font-size="12" fill="#FFFFFF">«external_system»</text><text x="700" y="80.6" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold"><tspan x="700" y="80.6">Mainframe Banking</tspan><tspan x="700" y="100.6">System</tspan></text><text x="700" y="128.4" text-anchor="middle" font-size="14" fill="#FFFFFF"><tspan x="700" y="128.4">Stores all of the core</tspan><tspan x="700" y="145.4">banking information about</tspan><tspan x="700" y="162.4">customers, accounts,</tspan><tspan x="700" y="179.4">transactions, etc.</tspan></text></g></g><g class="c4-rel-labels"><rect x="544.455" y="259.5" width="52.008" height="34" rx="2" ry="2" fill="white" stroke="none" opacity="0.85"/><text x="570.459" y="273.2" text-anchor="middle" font-siz