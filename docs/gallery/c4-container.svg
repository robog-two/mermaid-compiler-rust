<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" class="c4" style="max-width: 955.489px; background-color: white;" viewBox="0 -70 955.489 1546.478" role="graphics-document document" aria-roledescription="c4"><style>#my-svg{font-family:&quot;trebuchet ms&quot;, verdana, arial, sans-serif;font-size:16px;}#my-svg text{font-family:&quot;trebuchet ms&quot;, verdana, arial, sans-serif;}</style><g><g class="c4-shape c4-external_system"><rect x="150" y="167" width="216" height="100.628" rx="12" ry="12" fill="#999999" stroke="#8A8A8A" stroke-width="2"/><text class="c4-name" x="258" y="200" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">E-Mail System</text><text class="c4-type" x="258" y="216" text-anchor="middle" font-size="10.5" fill="#FFFFFF">[Software System]</text><text class="c4-descr" x="258" y="232" text-anchor="middle" font-size="11.48" fill="#FFFFFF"><tspan x="258" y="232">The internal Microsoft Exchange</tspan><tspan x="258" y="244.628">system</tspan></text></g><g class="c4-shape c4-person"><rect x="466" y="252.946" width="216" height="100.628" rx="38.232" ry="38.232" fill="#08427B" stroke="#073B6F" stroke-width="2"/><path d="M623.68,216.68C623.68,244.118,601.438,266.36,574,266.36C546.562,266.36,524.32,244.118,524.32,216.68C524.32,189.242,546.562,167,574,167C601.438,167,623.68,189.242,623.68,216.68Z" fill="#08427B" stroke="#073B6F" stroke-width="2"/><text class="c4-name" x="574" y="285.946" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Customer</text><text class="c4-type" x="574" y="301.946" text-anchor="middle" font-size="10.5" fill="#FFFFFF">[Person]</text><text class="c4-descr" x="574" y="317.946" text-anchor="middle" font-size="11.48" fill="#FFFFFF"><tspan x="574" y="317.946">A customer of the bank, with</tspan><tspan x="574" y="330.574">personal bank accounts</tspan></text></g><g class="c4-shape c4-external_system"><rect x="150" y="453.574" width="222.834" height="112.256" rx="12" ry="12" fill="#999999" stroke="#8A8A8A" stroke-width="2"/><text class="c4-name" x="261.417" y="486.574" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Mainframe Banking System</text><text class="c4-type" x="261.417" y="502.574" text-anchor="middle" font-size="10.5" fill="#FFFFFF">[Software System]</text><text class="c4-descr" x="261.417" y="518.574" text-anchor="middle" font-size="11.48" fill="#FFFFFF"><tspan x="261.417" y="518.574">Stores all of the core banking</tspan><tspan x="261.417" y="531.202">information about customers,</tspan><tspan x="261.417" y="543.83">accounts, transactions, etc.</tspan></text></g><g class="c4-shape c4-container"><rect x="200" y="772.83" width="216" height="112.256" rx="12" ry="12" fill="#438DD5" stroke="#3C7FC0" stroke-width="2"/><text class="c4-name" x="308" y="805.83" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Single-Page App</text><text class="c4-type" x="308" y="821.83" text-anchor="middle" font-size="10.5" fill="#FFFFFF">[Container: JavaScript, Angular]</text><text class="c4-descr" x="308" y="837.83" text-anchor="middle" font-size="11.48" fill="#FFFFFF"><tspan x="308" y="837.83">Provides all the Internet banking</tspan><tspan x="308" y="850.458">functionality to customers via their</tspan><tspan x="308" y="863.086">web browser</tspan></text></g><g class="c4-shape c4-external_container"><rect x="516" y="772.83" width="216" height="112.256" rx="12" ry="12" fill="#B3B3B3" stroke="#A6A6A6" stroke-width="2"/><text class="c4-name" x="624" y="805.83" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Mobile App</text><text class="c4-type" x="624" y="821.83" text-anchor="middle" font-size="10.5" fill="#FFFFFF">[Container: C#, Xamarin]</text><text class="c4-descr" x="624" y="837.83" text-anchor="middle" font-size="11.48" fill="#FFFFFF"><tspan x="624" y="837.83">Provides a limited subset of the</tspan><tspan x="624" y="850.458">Internet banking functionality to</tspan><tspan x="624" y="863.086">customers via their mobile device</tspan></text></g><g class="c4-shape c4-container"><rect x="200" y="985.086" width="216" height="100.628" rx="12" ry="12" fill="#438DD5" stroke="#3C7FC0" stroke-width="2"/><text class="c4-name" x="308" y="1018.086" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Web Application</text><text class="c4-type" x="308" y="1034.086" text-anchor="middle" font-size="10.5" fill="#FFFFFF">[Container: Java, Spring MVC]</text><text class="c4-descr" x="308" y="1050.086" text-anchor="middle" font-size="11.48" fill="#FFFFFF"><tspan x="308" y="1050.086">Delivers the static content and the</tspan><tspan x="308" y="1062.714">Internet banking SPA</tspan></text></g><g class="c4-shape c4-container_db"><path d="M516,1000.922C516,992.176,564.353,985.086,624,985.086C683.647,985.086,732,992.176,732,1000.922L732,1110.014C732,1118.76,683.647,1125.85,624,1125.85C564.353,1125.85,516,1118.76,516,1110.014Z" fill="#438DD5" stroke="#3C7FC0" stroke-width="2"/><path d="M516,1000.922C516,1009.668,564.353,1016.758,624,1016.758C683.647,1016.758,732,1009.668,732,1000.922" fill="none" stroke="#3C7FC0" stroke-width="2"/><text class="c4-name" x="624" y="1045.173" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Database</text><text class="c4-type" x="624" y="1061.173" text-anchor="middle" font-size="10.5" fill="#FFFFFF">[Container: SQL Database]</text><text class="c4-descr" x="624" y="1077.173" text-anchor="middle" font-size="11.48" fill="#FFFFFF"><tspan x="624" y="1077.173">Stores user registration</tspan><tspan x="624" y="1089.801">information, hashed auth</tspan><tspan x="624" y="1102.429">credentials, access logs, etc.</tspan></text></g><g class="c4-shape c4-container_queue"><path d="M207.83,1225.85L431.659,1225.85C435.984,1225.85,439.489,1238.61,439.489,1254.35C439.489,1270.09,435.984,1282.85,431.659,1282.85L207.83,1282.85C203.505,1282.85,200,1270.09,200,1254.35C200,1238.61,203.505,1225.85,207.83,1225.85Z" fill="#438DD5" stroke="#3C7FC0" stroke-width="2"/><path d="M431.659,1282.85C427.335,1282.85,423.83,1270.09,423.83,1254.35C423.83,1238.61,427.335,1225.85,431.659,1225.85" fill="none" stroke="#3C7FC0" stroke-width="2"/><text class="c4-name" x="311.915" y="1243.85" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Event Bus</text><text class="c4-type" x="311.915" y="1259.85" text-anchor="middle" font-size="10.5" fill="#FFFFFF">[Container: Kafka]</text><text class="c4-descr" x="311.915" y="1275.85" text-anchor="middle" font-size="11.48" fill="#FFFFFF">Publishes account events</text></g><g class="c4-shape c4-container"><rect x="539.489" y="1225.85" width="216" height="100.628" rx="12" ry="12" fill="#438DD5" stroke="#3C7FC0" stroke-width="2"/><text class="c4-name" x="647.489" y="1258.85" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">API Application</text><text class="c4-type" x="647.489" y="1274.85" text-anchor="middle" font-size="10.5" fill="#FFFFFF">[Container: Java, Docker Container]</text><text class="c4-descr" x="647.489" y="1290.85" text-anchor="middle" font-size="11.48" fill="#FFFFFF"><tspan x="647.489" y="1290.85">Provides Internet banking</tspan><tspan x="647.489" y="1303.478">functionality via API</tspan></text></g><g class="c4-boundary"><rect x="150" y="672.83" width="655.489" height="703.647" rx="2.5" ry="2.5" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="7 7"/><text x="477.745" y="687.83" text-anchor="middle" font-size="16" fill="#444444" font-weight="bold">Internet Banking</text><text x="477.745" y="710.83" text-anchor="middle" font-size="14" fill="#444444">[CONTAINER]</text></g><g class="c4-rels"><path d="M542.078,353.307L325.267,985.086" fill="none" stroke="#444444" stroke-width="1"/><path d="M324.942,986.032L323.459,974.951L332.917,978.197Z" fill="#333" stroke="#333" stroke-width="1"/><text x="447.172" y="675.197" text-anchor="middle" font-size="12" fill="#444444">Uses</text><text x="453.172" y="692.197" tex