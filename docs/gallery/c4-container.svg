nchor="middle" font-size="11.48" fill="#FFFFFF"><tspan x="424" y="428.122">Provides a limited subset of the</tspan><tspan x="424" y="440.75">Internet banking functionality to</tspan><tspan x="424" y="453.378">customers via their mobile device</tspan></text></g><g class="c4-shape c4-container"><rect x="612" y="363" width="216" height="100" rx="12" ry="12" fill="#438DD5" stroke="#3C7FC0" stroke-width="2"/><text class="c4-name" x="720" y="395.936" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Web Application</text><text class="c4-type" x="720" y="411.936" text-anchor="middle" font-size="10.5" fill="#FFFFFF">[Container: Java, Spring MVC]</text><text class="c4-descr" x="720" y="427.936" text-anchor="middle" font-size="11.48" fill="#FFFFFF"><tspan x="720" y="427.936">Delivers the static content and the</tspan><tspan x="720" y="440.564">Internet banking SPA</tspan></text></g><g class="c4-shape c4-container_db"><path d="M20,561.836C20,553.09,68.353,546,128,546C187.647,546,236,553.09,236,561.836L236,670.164C236,678.91,187.647,686,128,686C68.353,686,20,678.91,20,670.164Z" fill="#438DD5" stroke="#3C7FC0" stroke-width="2"/><path d="M20,561.836C20,570.582,68.353,577.672,128,577.672C187.647,577.672,236,570.582,236,561.836" fill="none" stroke="#3C7FC0" stroke-width="2"/><text class="c4-name" x="128" y="605.955" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Database</text><text class="c4-type" x="128" y="621.955" text-anchor="middle" font-size="10.5" fill="#FFFFFF">[Container: SQL Database]</text><text class="c4-descr" x="128" y="637.955" text-anchor="middle" font-size="11.48" fill="#FFFFFF"><tspan x="128" y="637.955">Stores user registration</tspan><tspan x="128" y="650.583">information, hashed auth</tspan><tspan x="128" y="663.211">credentials, access logs, etc.</tspan></text></g><g class="c4-shape c4-container_queue"><path d="M323.83,546L547.17,546C551.495,546,555,558.76,555,574.5C555,590.24,551.495,603,547.17,603L323.83,603C319.50