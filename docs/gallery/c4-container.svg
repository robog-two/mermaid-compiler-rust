.34" y="659.441">[AMQP]</tspan></text><rect x="198.575" y="112.246" width="95.364" height="19" rx="2" ry="2" fill="white" stroke="none" opacity="0.85"/><text x="246.257" y="125.946" text-anchor="middle" font-size="12" fill="#444444">Sends e-mails to</text><rect x="166.745" y="175.36" width="114.036" height="34" rx="2" ry="2" fill="white" stroke="none" opacity="0.85"/><text x="223.763" y="189.06" text-anchor="middle" font-size="12" fill="#444444"><tspan x="223.763" y="189.06">Sends e-mails using</tspan><tspan x="223.763" y="204.06">[sync, SMTP]</tspan></text><rect x="634.397" y="290.2" width="146.04" height="34" rx="2" ry="2" fill="white" stroke="none" opacity="0.85"/><text x="707.417" y="303.9" text-anchor="middle" font-size="12" fill="#444444"><tspan x="707.417" y="303.9">Uses</tspan><tspan x="707.417" y="318.9">[sync/async, XML/HTTPS]</tspan></text></g><g class="c4-title"><text class="c4-title" x="424" y="22.3" text-anchor="middle" font-size="18" fill="#444444" font-weight="bold">Container diagram for Internet Banking System</text></g></g></svg>