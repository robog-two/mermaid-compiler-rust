<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 500px; background-color: white;" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart"><style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#552222;}#my-svg .error-text{fill:#552222;stroke:#552222;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#000000;stroke:#000000;}#my-svg .marker.cross{stroke:#000000;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .node .neo-node{stroke:#13540c;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,0.5));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,0.5));}#my-svg [data-look="neo"].node .neo-line path{stroke:#13540c;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,0.5));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,0.5));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,0.5));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="45" width="232" height="212" fill="#ff0000"/><text x="0" y="0" fill="#321b67" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 50) rotate(0)">We should expand</text></g><g class="quadrant"><rect x="31" y="45" width="232" height="212" fill="#00ff00"/><text x="0" y="0" fill="#2d1662" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 50) rotate(0)">Need to promote</text></g><g class="quadrant"><rect x="31" y="257" width="232" height="212" fill="#d7eea2"/><text x="0" y="0" fill="#28115d" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 262) rotate(0)">Re-evaluate</text></g><g class="quadrant"><rect x="263" y="257" width="232" height="212" fill="#dcf3a7"/><text x="0" y="0" fill="#230c58" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 262) rotate(0)">May be improved</text></g></g><g class="border"><line x1="30" y1="45" x2="496" y2="45" style="stroke: rgb(171, 181, 148); stroke-width: 2;"/><line x1="495" y1="46" x2="495" y2="468" style="stroke: rgb(171, 181, 148); stroke-width: 2;"/><line x1="30" y1="469" x2="496" y2="469" style="stroke: rgb(171, 181, 148); stroke-width: 2;"/><line x1="31" y1="46" x2="31" y2="468" style="stroke: rgb(171, 181, 148); stroke-width: 2;"/><line x1="263" y1="46" x2="263" y2="468" style="stroke: rgb(171, 181, 148); stroke-width: 1;"/><line x1="32" y1="257" x2="494" y2="257" style="stroke: rgb(171, 181, 148); stroke-width: 1;"/></g><g class="data-points"><g class="data-point"><circle cx="239.8" cy="371.48" r="5" fill="#0000ff" stroke="#0000ff" stroke-width="0px"/><text x="0" y="0" fill="#321b67" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(239.8, 376.48) rotate(0)">Beta</text></g><g class="data-point"><circle cx="170.2" cy="214.60000000000002" r="5" fill="#0000ff" stroke="#0000ff" stroke-width="0px"/><text x="0" y="0" fill="#321b67" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(170.2, 219.60000000000002) rotate(0)">Alpha</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#ff00ff" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 479) rotate(0)">Low Reach</text></g><g class="label"><text x="0" y="0" fill="#ff00ff" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 479) rotate(0)">High Reach</text></g><g class="label"><text x="0" y="0" fill="#321b67" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 363) rotate(-90)">Low</text></g><g class="label"><text x="0" y="0" fill="#321b67" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 151) rotate(-90)">High</text></g></g><g class="title"><text x="0" y="0" fill="#aa00aa" font-size="20" dominant-baseline="hanging" text-anchor="middle" transform="translate(250, 10) rotate(0)">Forest with vars</text></g></g></svg>
